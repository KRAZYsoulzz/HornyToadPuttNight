<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#121010" />
  <!-- Disc Golf Basket in Neon Amber -->
  <g fill="none" stroke="#FFB238" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Band / Deflector -->
    <rect x="140" y="110" width="232" height="34" rx="6" fill="#FFB238" fill-opacity="0.15" stroke="#FFB238" stroke-width="12" />
    <line x1="140" y1="127" x2="372" y2="127" stroke="#FFB238" stroke-width="6" opacity="0.6" />

    <!-- Central Pole -->
    <line x1="256" y1="144" x2="256" y2="420" stroke="#FFB238" stroke-width="16" />

    <!-- Hanging Chains -->
    <!-- Outer Chains -->
    <path d="M 166 144 Q 176 210 230 252" stroke="#FFB238" stroke-width="8" stroke-dasharray="10 6" />
    <path d="M 346 144 Q 336 210 282 252" stroke="#FFB238" stroke-width="8" stroke-dasharray="10 6" />
    <!-- Mid Chains -->
    <path d="M 196 144 Q 212 216 244 256" stroke="#FFB238" stroke-width="8" stroke-dasharray="10 6" />
    <path d="M 316 144 Q 300 216 268 256" stroke="#FFB238" stroke-width="8" stroke-dasharray="10 6" />
    <!-- Inner Chains -->
    <path d="M 226 144 Q 236 216 252 258" stroke="#FFB238" stroke-width="8" stroke-dasharray="10 6" />
    <path d="M 286 144 Q 276 216 260 258" stroke="#FFB238" stroke-width="8" stroke-dasharray="10 6" />
    <!-- Center Chain -->
    <path d="M 256 144 L 256 260" stroke="#FFB238" stroke-width="8" stroke-dasharray="10 6" />

    <!-- Basket Tray / Cage -->
    <path d="M 126 264 L 146 348 C 146 360 366 360 366 348 L 386 264 Z" fill="#FFB238" fill-opacity="0.12" stroke="#FFB238" stroke-width="14" />
    <!-- Basket Vertical Struts -->
    <line x1="172" y1="264" x2="182" y2="352" stroke="#FFB238" stroke-width="8" />
    <line x1="214" y1="264" x2="218" y2="356" stroke="#FFB238" stroke-width="8" />
    <line x1="298" y1="264" x2="294" y2="356" stroke="#FFB238" stroke-width="8" />
    <line x1="340" y1="264" x2="330" y2="352" stroke="#FFB238" stroke-width="8" />

    <!-- Base Stand -->
    <path d="M 180 440 L 256 420 L 332 440" stroke="#FFB238" stroke-width="14" />
    <line x1="200" y1="440" x2="312" y2="440" stroke="#FFB238" stroke-width="10" />
  </g>
  <!-- Disc entering the basket in neon amber glow -->
  <ellipse cx="200" cy="190" rx="36" ry="10" transform="rotate(-18 200 190)" fill="#FFB238" />
</svg>