<!doctype html>
<html lang="en" data-theme="backbar" data-anim="on">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var theme = params.get('theme') || localStorage.getItem('htpn-theme') || 'backbar';
          if (theme === 'dark') theme = 'backbar';
          if (theme === 'light') theme = 'daylight';
          document.documentElement.dataset.theme = theme;

          var anim = localStorage.getItem('htpn-anim');
          if (!anim) {
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            anim = reduce ? 'off' : 'on';
          }
          document.documentElement.dataset.anim = anim;

          var metaColors = {
            backbar: '#121010',
            daylight: '#F3EEE4',
            classic: '#070B10',
            blacklight: '#070312',
            sunset: '#240D1E',
            arcade: '#050813',
            honkytonk: '#F5EBD7',
            broadcast: '#0D2818'
          };
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme && metaColors[theme]) {
            metaTheme.setAttribute('content', metaColors[theme]);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121010" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Horny Toad Putt Night</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
